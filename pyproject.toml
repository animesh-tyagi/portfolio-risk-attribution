[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-attribution"
version = "0.1.0"
description = "An educational CSV-driven portfolio volatility attribution project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "streamlit>=1.35,<2",
  "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
data = ["yfinance>=0.2.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
